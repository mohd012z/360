name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle project
        run: |
          java -version
          gradle --version
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle

      - name: Compile Kotlin
        shell: bash
        run: |
          set +e
          gradle :app:compileDebugKotlin --no-daemon --warning-mode all --console=plain 2>&1 | tee kotlin-compile.log
          status=${PIPESTATUS[0]}

          echo
          echo "================ KOTLIN ROOT ERRORS ================"
          grep -n -E '(^e: |^error: |\.kt:[0-9]+:[0-9]+|Unresolved reference|Type mismatch|Cannot infer|Expecting|No value passed|Too many arguments|Overload resolution ambiguity|Smart cast)' kotlin-compile.log | head -200 || true
          echo "===================================================="
          echo

          {
            echo "## Kotlin compiler diagnostics"
            echo '~~~text'
            grep -n -E '(^e: |^error: |\.kt:[0-9]+:[0-9]+|Unresolved reference|Type mismatch|Cannot infer|Expecting|No value passed|Too many arguments|Overload resolution ambiguity|Smart cast)' kotlin-compile.log | head -200 || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-compiler-diagnostics
          path: kotlin-compile.log
          if-no-files-found: error

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Playback360-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
